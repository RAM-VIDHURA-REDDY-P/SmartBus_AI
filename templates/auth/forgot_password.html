
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | SmartBus AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/navigation.css') }}">

    <script src="{{ url_for('static', filename='js/navigation.js') }}"
            defer></script>
</head>

<body>

<div class="page-container">

    <h1>SMARTBUS AI</h1>
    <h2 style="text-align:center;">Forgot Password?</h2>

    <p class="subtitle">
        Enter your registered email address.
        We will send you a secure password reset link.
    </p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="message {{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">

        <input type="hidden"
               name="csrf_token"
               value="{{ csrf_token() }}">

        <label>Email Address</label>
        <input type="email"
               name="email"
               placeholder="Enter registered email"
               autocomplete="email"
               required>

        <button type="submit" class="primary-button">
            Send Reset Link
        </button>

    </form>

    <a href="{{ url_for('auth.login') }}" class="back-button">
        ← Back to Login
    </a>

</div>

</body>
</html>
