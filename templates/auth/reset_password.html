
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | SmartBus AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/navigation.css') }}">

    <script src="{{ url_for('static', filename='js/navigation.js') }}"
            defer></script>
</head>

<body>

<div class="page-container">

    <h1>SMARTBUS AI</h1>
    <h2 style="text-align:center;">Create New Password</h2>

    <p class="subtitle">
        Enter and confirm your new password.
    </p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="message {{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">

        <input type="hidden"
               name="csrf_token"
               value="{{ csrf_token() }}">

        <label>New Password</label>
        <input type="password"
               name="password"
               placeholder="Enter new password"
               minlength="8"
               autocomplete="new-password"
               required>

        <label>Confirm New Password</label>
        <input type="password"
               name="confirm_password"
               placeholder="Confirm new password"
               minlength="8"
               autocomplete="new-password"
               required>

        <button type="submit" class="primary-button">
            Reset Password
        </button>

    </form>

    <a href="{{ url_for('auth.forgot_password') }}"
       class="back-button">
        ← Back to Forgot Password
    </a>

</div>

</body>
</html>
